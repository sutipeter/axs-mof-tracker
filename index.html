<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AXS Core Technologies | Project Access</title>
<style>
:root{--graphite:#545454;--gold:#A68B63;--cream:#F8F6F2;--line:#DDD7CF;--muted:#77736D;--danger:#A8473E}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--cream);color:#2D2D2D}
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(430px,94vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 18px 60px rgba(60,50,40,.13);border-top:4px solid var(--gold)}
.brand{font-weight:900;color:var(--graphite);font-size:14px;letter-spacing:.02em}
h1{margin:9px 0 7px;font-size:28px;color:#373737}
p{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.55}
label{display:block;font-size:12px;color:var(--muted);margin-top:12px}
input{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;outline:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(166,139,99,.13)}
#loginBtn{width:100%;margin-top:18px;border:0;border-radius:10px;padding:12px;background:var(--gold);color:#fff;font-weight:900;cursor:pointer}
#loginBtn:disabled{opacity:.6;cursor:wait}
.error{display:none;margin-top:12px;color:var(--danger);font-size:12px}
.foot{font-size:10px;color:#999;text-align:center;margin-top:18px}
.langswitch{display:flex;justify-content:flex-end;margin-bottom:12px}
.langswitch-inner{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#fff}
.langswitch button{width:auto;margin:0;border:0;border-radius:999px;padding:6px 10px;background:transparent;color:var(--muted);font-size:11px;font-weight:900;cursor:pointer}
.langswitch button.active{background:var(--graphite);color:#fff}
#appframe{display:none;width:100%;height:100vh;border:0;background:#fff}
</style>
</head>
<body>
<div id="login" class="loginwrap">
<form class="card" id="loginForm">
  <div class="langswitch"><div class="langswitch-inner">
    <button type="button" id="loginHuBtn">HU</button>
    <button type="button" id="loginEnBtn">EN</button>
  </div></div>
  <div class="brand">AXS Core Technologies</div>
  <h1 id="loginTitle">Projekt hozzáférés</h1>
  <p id="loginIntro">A UAE MoF Pre-Approval dashboard titkosított projektfelület. Add meg a hozzáférési adatokat.</p>
  <label><span id="userLabel">Felhasználónév</span><input id="user" autocomplete="username" required></label>
  <label><span id="passLabel">Jelszó</span><input id="pass" type="password" autocomplete="current-password" required></label>
  <button id="loginBtn" type="submit">Belépés</button>
  <div id="err" class="error">Hibás felhasználónév vagy jelszó.</div>
  <div class="foot" id="loginFoot">Titkosított statikus hozzáférés • AES-GCM / PBKDF2</div>
</form>
</div>
<iframe id="appframe" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads"></iframe>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(p){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64(SALT),iterations:250000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']
  );
}
async function unlock(user,pass){
  if(user!==EXPECTED_USER) throw new Error('auth');
  const key=await derive(pass);
  const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(NONCE)},key,b64(PAYLOAD));
  const blob=new Blob([clear],{type:'text/html'});
  return URL.createObjectURL(blob);
}
const LOGIN_I18N={
  hu:{
    title:'Projekt hozzáférés',
    intro:'A UAE MoF Pre-Approval dashboard titkosított projektfelület. Add meg a hozzáférési adatokat.',
    user:'Felhasználónév',pass:'Jelszó',login:'Belépés',logging:'Belépés…',
    error:'Hibás felhasználónév vagy jelszó.',
    foot:'Titkosított statikus hozzáférés • AES-GCM / PBKDF2'
  },
  en:{
    title:'Project access',
    intro:'The UAE MoF Pre-Approval dashboard is an encrypted project workspace. Enter your access credentials.',
    user:'Username',pass:'Password',login:'Sign in',logging:'Signing in…',
    error:'Incorrect username or password.',
    foot:'Encrypted static access • AES-GCM / PBKDF2'
  }
};
let loginLang=localStorage.getItem('axs-login-lang')||localStorage.getItem('axs-lang')||'hu';
function applyLoginLang(){
  const t=LOGIN_I18N[loginLang]||LOGIN_I18N.hu;
  document.documentElement.lang=loginLang;
  loginTitle.textContent=t.title; loginIntro.textContent=t.intro;
  userLabel.textContent=t.user; passLabel.textContent=t.pass;
  loginBtn.textContent=t.login; err.textContent=t.error; loginFoot.textContent=t.foot;
  loginHuBtn.classList.toggle('active',loginLang==='hu');
  loginEnBtn.classList.toggle('active',loginLang==='en');
  localStorage.setItem('axs-login-lang',loginLang);
  localStorage.setItem('axs-lang',loginLang);
}
loginHuBtn.addEventListener('click',()=>{loginLang='hu';applyLoginLang();});
loginEnBtn.addEventListener('click',()=>{loginLang='en';applyLoginLang();});
applyLoginLang();

loginForm.addEventListener('submit',async e=>{
  e.preventDefault(); err.style.display='none'; loginBtn.disabled=true;
  loginBtn.textContent=LOGIN_I18N[loginLang].logging;
  try{
    localStorage.setItem('axs-lang',loginLang);
    const url=await unlock(user.value.trim(),pass.value);
    appframe.src=url; appframe.style.display='block'; login.style.display='none';
    document.body.style.background='#fff';
  }catch(e){
    err.textContent=LOGIN_I18N[loginLang].error; err.style.display='block'; pass.select();
  }finally{
    loginBtn.disabled=false; loginBtn.textContent=LOGIN_I18N[loginLang].login;
  }
});
</script>
